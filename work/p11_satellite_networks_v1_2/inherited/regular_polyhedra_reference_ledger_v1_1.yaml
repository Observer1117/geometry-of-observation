    expressions:
      - id: observed_coordinate_sum
        anchor: equation (12), y_i equals x_i plus eta_i
        ast: {op: add, args: [{q: rp.true_coordinate}, {q: rp.noise_vector}]}
        expect: {outcome: pass, rules: [], dimension: [1, 0, 0, 0, 0, 0, 0], semantic_kind: vector, frame: observer}
      - id: noise_vector_norm
        anchor: equation (12), norm eta_i
        ast: {op: norm, arg: {q: rp.noise_vector}}
        expect: {outcome: pass, rules: [], dimension: [1, 0, 0, 0, 0, 0, 0], semantic_kind: scalar, frame: scalar}
      - id: noise_bound_comparison
        anchor: equation (12), norm eta_i at most epsilon
        ast: {op: compare, left: {q: rp.noise_norm}, right: {q: rp.noise_bound}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: twice_noise_bound
        anchor: proposition 8.1, two epsilon
        ast: {op: mul, left: {const: 2}, right: {q: rp.noise_bound}}
        expect: {outcome: pass, rules: [], dimension: [1, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: residual_bound_comparison
        anchor: proposition 8.1, residual at most two epsilon
        ast: {op: compare, left: {q: rp.symmetry_residual}, right: {q: rp.twice_noise_bound}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: normalized_symmetry_residual
        anchor: equation (13), delta equals residual over reference length
        ast:
          op: normalize
          value: {q: rp.symmetry_residual}
          reference: {q: rp.reference_length}
          zero_policy: strictly_positive_reference_length
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: symmetry_residual_squared
        anchor: equation (13), squared RMS residual
        ast: {op: pow, arg: {q: rp.symmetry_residual}, exponent: 2}
        expect: {outcome: pass, rules: [], dimension: [2, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: symmetry_residual_from_square
        anchor: equation (13), square root of mean squared residual
        ast: {op: sqrt, arg: {q: rp.symmetry_residual_squared}}
        expect: {outcome: pass, rules: [], dimension: [1, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: half_candidate_separation
        anchor: theorem 8.2, Delta_i over two
        ast: {op: mul, left: {q: rp.one_half}, right: {q: rp.candidate_separation}}
        expect: {outcome: pass, rules: [], dimension: [1, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: identification_margin_comparison
        anchor: theorem 8.2, observed distance below half separation
        ast: {op: compare, left: {q: rp.model_distance}, right: {q: rp.half_separation}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: p_times_F
        anchor: equation (8), pF
        ast: {op: mul, left: {q: rp.face_length}, right: {q: rp.face_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: two_times_E
        anchor: equation (8), two E
        ast: {op: mul, left: {const: 2}, right: {q: rp.edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: face_edge_incidence_comparison
        anchor: equation (8), pF equals two E
        ast: {op: compare, left: {q: rp.incidence_pF}, right: {q: rp.twice_edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: q_times_V
        anchor: equation (8), qV
        ast: {op: mul, left: {q: rp.vertex_valence}, right: {q: rp.vertex_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: vertex_edge_incidence_comparison
        anchor: equation (8), qV equals two E
        ast: {op: compare, left: {q: rp.incidence_qV}, right: {q: rp.twice_edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: Euler_vertex_minus_edge
        anchor: equation (9), V minus E
        ast: {op: sub, args: [{q: rp.vertex_count}, {q: rp.edge_count}]}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: count}
      - id: Euler_characteristic_sum
        anchor: equation (9), V minus E plus F
        ast:
          op: add
          args:
            - {op: sub, args: [{q: rp.vertex_count}, {q: rp.edge_count}]}
            - {q: rp.face_count}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: count}
      - id: Euler_characteristic_comparison
        anchor: equation (9), Euler left side and chi
        ast: {op: compare, left: {q: rp.Euler_characteristic}, right: {const: 2}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: four_times_E
        anchor: proposition 2.1, four flags per edge
        ast: {op: mul, left: {const: 4}, right: {q: rp.edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: flag_count_comparison
        anchor: proposition 2.1, number of flags equals four E
        ast: {op: compare, left: {q: rp.flag_count}, right: {q: rp.fourfold_edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: regular_group_order_comparison
        anchor: proposition 2.1, group order equals flag count
        ast: {op: compare, left: {q: rp.group_order}, right: {q: rp.flag_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: reciprocal_face_length
        anchor: equation (10), reciprocal p
        ast: {op: div, left: {const: 1}, right: {q: rp.face_length}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: reciprocal_vertex_valence
        anchor: equation (10), reciprocal q
        ast: {op: div, left: {const: 1}, right: {q: rp.vertex_valence}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: reciprocal_sum
        anchor: equation (10), reciprocal p plus reciprocal q
        ast: {op: add, args: [{q: rp.reciprocal_p}, {q: rp.reciprocal_q}]}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: spherical_type_left_side
        anchor: equation (10), reciprocal p plus reciprocal q minus one half
        ast:
          op: sub
          args:
            - {op: add, args: [{q: rp.reciprocal_p}, {q: rp.reciprocal_q}]}
            - {q: rp.one_half}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: reciprocal_edge_count
        anchor: equation (10), one over E
        ast: {op: div, left: {const: 1}, right: {q: rp.edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: spherical_identity_comparison
        anchor: equation (10), spherical left side equals reciprocal E
        ast: {op: compare, left: {q: rp.spherical_left}, right: {q: rp.reciprocal_E}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: dual_vertex_face_comparison
        anchor: duality f-vector action, V star equals F
        ast: {op: compare, left: {q: rp.dual_vertex_count}, right: {q: rp.face_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: dual_edge_comparison
        anchor: duality f-vector action, E star equals E
        ast: {op: compare, left: {q: rp.dual_edge_count}, right: {q: rp.edge_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: dual_face_vertex_comparison
        anchor: duality f-vector action, F star equals V
        ast: {op: compare, left: {q: rp.dual_face_count}, right: {q: rp.vertex_count}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: orbit_weight_normalization
        anchor: equation (15), orbit size divided by total flag count
        ast:
