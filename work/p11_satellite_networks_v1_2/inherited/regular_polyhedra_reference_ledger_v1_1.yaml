schema:
  id: go-regular-polyhedra-reference-ledger
  version: 1.1.0
  date: 2026-07-28
  base_contract: go-core-spec@0.2.0
  inherited_contracts:
    - go-quantum-chemistry-observation-contract@1.0.0
  extension_contract: go-regular-polyhedra-observation-contract@1.1.0

documents:
  - id: regular-polyhedra-observation-v1-1
    title: Regular Polyhedra under Typed Observation Filters
    version: 1.1.0
    source:
      pdf: work/p10_regular_polyhedra_v1_1/build/polyhedra/regular_polyhedra_observation_filters_v1_1.pdf
      tex: work/p10_regular_polyhedra_v1_1/src/regular_polyhedra_observation_filters_v1_1.tex
      text: work/p10_regular_polyhedra_v1_1/checks/polyhedra/regular_polyhedra_observation_filters_v1_1.txt
      metrics_json: work/p10_regular_polyhedra_v1_1/data/regular_polyhedra_metrics_v1_1.json
      pages: 7
      sha256: 9193ad45b5dbbb2fac52392d383eb8878e937eacf817fd686b5f895ae0af1b0d
    ledger_level: reference
    migration_status: strict_reference_migrated
    unit_contexts:
      - SI
      - neutral
    groups:
      - abstract_automorphism_group
      - geometric_isometry_group
      - ambient_Euclidean_isometries
      - incidence_relabelings
      - cube_full_symmetry_group
      - generic_cuboid_metric_symmetry_group
    maps:
      - id: realization_choice
        domain: abstract_polyhedron_and_realization_convention
        codomain: realized_polyhedron_object
        kind: interpretation
        invertibility: not_required
        information_loss: not_applicable
      - id: induced_geometric_automorphism
        domain: geometric_isometry_group
        codomain: abstract_automorphism_group
        kind: interpretation
        invertibility: not_required
        information_loss: not_applicable
      - id: admissible_subgroupoid_inclusion
        domain: stricter_full_subgroupoid
        codomain: broader_full_subgroupoid
        kind: inclusion
        invertibility: injective_not_surjective
        information_loss: false
      - id: forget_face_set
        domain: full_incidence_polyhedron
        codomain: vertex_edge_skeleton
        kind: reduction
        invertibility: not_required
        information_loss: possible
      - id: deterministic_sensor_projection
        domain: realized_vertex_edge_face_data
        codomain: ideal_observer_record
        kind: deterministic_observation
        invertibility: not_required
        information_loss: possible
      - id: noisy_sensor_channel
        domain: ideal_observer_record
        codomain: measured_record
        kind: stochastic_channel
        invertibility: not_applicable
        information_loss: possible
      - id: information_coarsening
        domain: fine_observation_record
        codomain: coarse_observation_record
        kind: deterministic_observation
        invertibility: not_required
        information_loss: possible
      - id: Petrie_operation
        domain: regular_map_with_distinguished_generators
        codomain: Petrial_regular_map
        kind: interpretation
        invertibility: required
        information_loss: not_applicable
      - id: symmetry_residual_estimator
        domain: registered_noisy_points_and_candidate_isometry
        codomain: nonnegative_length_residual
        kind: estimator
        invertibility: not_applicable
        information_loss: not_a_map_property
      - id: finite_library_nearest_candidate
        domain: observed_record_and_finite_candidate_library
        codomain: candidate_label_and_margin
        kind: estimator
        invertibility: not_applicable
        information_loss: not_a_map_property
    symbols:
      - {scope: abstract_combinatorics, key: P, meaning: rank_3_abstract_polyhedron}
      - {scope: realization, key: beta, meaning: declared_geometric_realization}
      - {scope: abstract_symmetry, key: Gamma_P, meaning: automorphism_group}
      - {scope: geometric_symmetry, key: G_beta, meaning: Euclidean_realization_symmetry_group}
      - {scope: observation, key: O, meaning: typed_observation_specification}
      - {scope: observation, key: Q, meaning: invariant_observation_map}
      - {scope: incidence, key: p, meaning: face_length}
      - {scope: incidence, key: q, meaning: vertex_valence}
      - {scope: observation, key: epsilon, meaning: pointwise_noise_bound}
      - {scope: observation, key: delta, meaning: normalized_symmetry_residual}
    quantities:
      - id: rp.vertex_count
        symbol: V
        semantic_kind: count
