  expressions:
  - id: full_molecular_Hamiltonian_energy
    anchor: equation (1), five energy terms
    ast:
      op: add
      args:
      - q: qc.electronic_kinetic
      - q: qc.nuclear_kinetic
      - q: qc.electron_nuclear_energy
      - q: qc.electron_electron_energy
      - q: qc.nuclear_repulsion
    expect:
      outcome: pass
      rules: []
      dimension:
      - 2
      - 1
      - -2
      - 0
      - 0
      - 0
      - 0
      semantic_kind: scalar
  - id: clamped_Hamiltonian_energy
    anchor: equation (3), clamped electronic energy terms
    ast:
      op: add
      args:
      - q: qc.electronic_kinetic
      - q: qc.electron_nuclear_energy
      - q: qc.electron_electron_energy
      - q: qc.nuclear_repulsion
