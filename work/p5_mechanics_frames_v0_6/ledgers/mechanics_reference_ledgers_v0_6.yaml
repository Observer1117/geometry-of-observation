          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: explicit_contact_entropy_log
        anchor: section 6.2, log_b p_j
        ast:
          op: log
          base: b
          arg: {q: bob11.load_probability}
          semantic_kind: information
        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: information
      - id: normalized_contact_entropy
        anchor: section 6.2, H_b/log_b K
        ast:
          op: normalize
          value: {q: bob11.load_entropy}
          reference: {q: bob11.max_load_entropy}
          zero_policy: declared_K_at_least_2
