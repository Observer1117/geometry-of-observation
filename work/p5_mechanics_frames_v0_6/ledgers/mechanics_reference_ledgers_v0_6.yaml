        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: loss
      - id: guarded_load_imbalance
        anchor: section 6.3, abs(N_R-N_L)/(N_R+N_L)
        ast:
