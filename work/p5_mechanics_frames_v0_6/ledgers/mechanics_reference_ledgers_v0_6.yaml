        expect:
          outcome: pass
          rules: []
          dimension: [1, 1, -2, 0, 0, 0, 0]
          semantic_kind: vector
          frame: inertial
      - id: friction_power_dimension
        anchor: section 5, -T dot v_T
        ast:
          op: dot
          left: {q: bob11.tangential_force}
          right: {q: bob11.relative_velocity}
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -3, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: energy_rate
        anchor: section 5, dot E_L
        ast:
          op: derivative
          dependent: {q: bob11.energy}
          independent: {q: bob11.time}
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -3, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: energy_balance_rhs
        anchor: section 5, P_act-P_fric+P_con-partial_t_L
        ast:
          op: sub
          args:
            - {q: bob11.active_power}
            - {q: bob11.friction_power}
            - {q: bob11.constraint_power}
            - {q: bob11.explicit_lagrangian_power}
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -3, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: cone_capacity
        anchor: section 6.1, mu N
        ast:
