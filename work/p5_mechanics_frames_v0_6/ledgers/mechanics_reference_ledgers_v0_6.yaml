        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: curvature_demand
        anchor: section 6.4, v^2 kappa
        ast:
          op: mul
          left:
            op: pow
            arg: {q: bob11.speed}
            exponent: 2
          right: {q: bob11.curvature}
        expect:
          outcome: pass
          rules: []
          dimension: [1, 0, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: required_force
        anchor: section 6.4, m(a-g)
        ast:
          op: mul
          left: {q: bob11.mass}
          right: {q: bob11.required_acceleration}
          semantic_kind: vector
          frame: inertial
        expect:
          outcome: pass
          rules: []
          dimension: [1, 1, -2, 0, 0, 0, 0]
          semantic_kind: vector
          frame: inertial
