          right: {q: bob11.normal_force_magnitude}
        expect:
          outcome: pass
          rules: []
          dimension: [1, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: guarded_cone_utilization
        anchor: section 6.1, piecewise norm(T)/(mu N)
        ast:
          op: normalize
          value: {q: bob11.tangential_force_norm}
          reference: {q: bob11.friction_capacity}
          zero_policy: piecewise_zero_capacity_guard
        expect:
