documents:
  - id: si-hep-quantity-passport-v0-5
    title: SI-HEP Quantity Passport for Relativistic Beam Observation
    version: 0.5.0
    source:
      pdf: work/p4_lhc_si_hep_v0_5/build/passport/si_hep_quantity_passport_v0_5.pdf
      tex: work/p4_lhc_si_hep_v0_5/src/si_hep_quantity_passport_v0_5.tex
      text: work/p4_lhc_si_hep_v0_5/checks/passport_final/si_hep_quantity_passport_v0_5.txt
      contract: work/p4_lhc_si_hep_v0_5/core/si_hep_quantity_passport_v0_5.yaml
      data_yaml: work/p4_lhc_si_hep_v0_5/data/lhc_si_hep_inputs_v0_5.yaml
      data_csv: work/p4_lhc_si_hep_v0_5/data/si_hep_conversion_table_v0_5.csv
      metrics_json: work/p4_lhc_si_hep_v0_5/data/lhc_si_hep_metrics_v0_5.json
      pages: 8
      sha256: 9490d2d94a8b77e2a6f17d9f1098394d47e240cb98a38430a902132b534ad444
    ledger_level: reference
    migration_status: p4_reference_pass
    unit_contexts: [SI, HEP_natural, neutral]
    groups:
      - coherent_si_unit_rescalings
      - mechanical_dimension_lattice
      - invertible_si_hep_representation_changes
      - proper_orthochronous_lorentz_group
    maps:
      - id: mechanical_naturalization
        domain: admissible_typed_si_mechanical_quantity_and_energy_anchor
        codomain: hep_energy_coordinate
        kind: interpretation
        invertibility: required
        information_loss: false
      - id: mechanical_restoration
        domain: hep_energy_coordinate_and_passport
        codomain: typed_si_mechanical_quantity
        kind: interpretation
        invertibility: required
        information_loss: false
      - id: si_momentum_to_energy_four_vector
        domain: si_four_momentum
        codomain: si_energy_four_vector
        kind: interpretation
        invertibility: required
        information_loss: false
      - id: si_energy_to_hep_four_vector
        domain: si_energy_four_vector_and_energy_anchor
        codomain: hep_numerical_four_vector
        kind: interpretation
        invertibility: required
        information_loss: false
      - id: rigidity_bridge
        domain: si_rigidity_and_signed_charge_state
        codomain: hep_momentum_coordinate
        kind: interpretation
        invertibility: required
        information_loss: false
      - id: unit_conversion_audit
        domain: conversion_event
        codomain: pass_or_rejection_with_diagnostics
        kind: estimator
        invertibility: not_applicable
        information_loss: not_a_map_property
    symbols:
      - {scope: si_hep_passport, key: E0, meaning: declared_energy_anchor}
      - {scope: si_hep_passport, key: d_E, meaning: hep_energy_dimension}
      - {scope: si_hep_passport, key: U_SI, meaning: si_representative_of_one_natural_unit}
      - {scope: si_hep_passport, key: N_E0, meaning: natural_coordinate_map}
      - {scope: si_hep_passport, key: Pi_mu, meaning: si_energy_four_vector}
      - {scope: si_hep_passport, key: z, meaning: signed_integer_charge_state}
    quantities:
      - id: shp.mass
        extends: mechanics.mass
        symbol: m
      - id: shp.c
        extends: relativity.speed_of_light
        symbol: c
      - id: shp.hbar
        extends: quantum.hbar
        symbol: hbar
      - id: shp.energy_si
        extends: mechanics.energy
        symbol: E_SI
        frame: lab
      - id: shp.energy_anchor_si
        extends: mechanics.energy
        symbol: E0
        frame: invariant
      - id: shp.energy_hep
        extends: mechanics.energy
        symbol: E_N
        canonical_unit: GeV
        unit_context: HEP_natural
        frame: lab
      - id: shp.momentum_magnitude_si
        symbol: p_abs
        semantic_kind: scalar
        dimension: [1, 1, -1, 0, 0, 0, 0]
        canonical_unit: kg*m/s
        unit_context: SI
        frame: lab
        claim_status: definition
      - id: shp.momentum_energy_hep
        extends: mechanics.energy
        symbol: pi_N
        canonical_unit: GeV
        unit_context: HEP_natural
        frame: lab
      - id: shp.mass_energy_hep
        extends: mechanics.energy
        symbol: mu_N
        canonical_unit: GeV
        unit_context: HEP_natural
        frame: invariant
      - id: shp.length_si
        extends: geometry.length
        symbol: ell
      - id: shp.duration_si
        extends: time.duration
        symbol: tau
      - id: shp.charge_si
        symbol: q
        semantic_kind: scalar
        dimension: [0, 0, 1, 1, 0, 0, 0]
        canonical_unit: C
        unit_context: SI
        frame: invariant
        claim_status: definition
      - id: shp.rigidity_si
        symbol: B_rho
        semantic_kind: scalar
        dimension: [1, 1, -2, -1, 0, 0, 0]
        canonical_unit: T*m
        unit_context: SI
        frame: lab
        claim_status: definition
      - id: shp.voltage_si
        symbol: V
        semantic_kind: scalar
        dimension: [2, 1, -3, -1, 0, 0, 0]
        canonical_unit: V
        unit_context: SI
        frame: apparatus
        claim_status: definition
      - id: shp.phase
        extends: geometry.angle
        symbol: phi
    expressions:
      - id: si_mass_energy
        anchor: section 5, mu=m*c^2
        ast:
          op: mul
          left: {q: shp.mass}
          right:
            op: pow
            arg: {q: shp.c}
            exponent: 2
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: si_momentum_energy
        anchor: section 5, pi=c*p
        ast:
          op: mul
          left: {q: shp.c}
          right: {q: shp.momentum_magnitude_si}
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: si_mass_shell_energy_chart
        anchor: section 5, mu^2=E^2-pi^2
        ast:
          op: sub
          args:
            - op: pow
              arg: {q: shp.energy_si}
              exponent: 2
            - op: pow
              arg:
                op: mul
                left: {q: shp.c}
                right: {q: shp.momentum_magnitude_si}
              exponent: 2
        expect:
          outcome: pass
          rules: []
          dimension: [4, 2, -4, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: hep_mass_shell
        anchor: section 5, mu_N^2=E_N^2-pi_N^2
        ast:
          op: sub
          args:
            - op: pow
              arg: {q: shp.energy_hep}
              exponent: 2
            - op: pow
              arg: {q: shp.momentum_energy_hep}
              exponent: 2
        expect:
          outcome: pass
          rules: []
          dimension: [4, 2, -4, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: one_gev_inverse_length
        anchor: section 4, hbar*c/E0
        ast:
          op: div
          left:
            op: mul
            left: {q: shp.hbar}
            right: {q: shp.c}
          right: {q: shp.energy_anchor_si}
        expect:
          outcome: pass
          rules: []
          dimension: [1, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: one_gev_inverse_duration
        anchor: section 4, hbar/E0
        ast:
          op: div
          left: {q: shp.hbar}
          right: {q: shp.energy_anchor_si}
        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 1, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: one_gev_per_c_momentum
        anchor: section 4, E0/c
        ast:
          op: div
          left: {q: shp.energy_anchor_si}
          right: {q: shp.c}
        expect:
          outcome: pass
          rules: []
          dimension: [1, 1, -1, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: one_gev_minus_two_area
        anchor: section 4, (hbar*c/E0)^2
        ast:
          op: pow
          arg:
            op: div
            left:
              op: mul
              left: {q: shp.hbar}
              right: {q: shp.c}
            right: {q: shp.energy_anchor_si}
          exponent: 2
        expect:
          outcome: pass
          rules: []
          dimension: [2, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: magnetic_rigidity_si
        anchor: section 6, p=q*B*rho
        ast:
          op: mul
          left: {q: shp.charge_si}
          right: {q: shp.rigidity_si}
        expect:
          outcome: pass
          rules: []
          dimension: [1, 1, -1, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: rf_voltage_energy
        anchor: section 6, DeltaE=q*V*sin(phi)
        ast:
          op: mul
          left:
            op: mul
            left: {q: shp.charge_si}
            right: {q: shp.voltage_si}
          right:
            op: trig
            function: sin
            arg: {q: shp.phase}
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: explicit_si_to_hep_energy_boundary
        anchor: section 3, N_E0(E)
        ast:
          op: convert
          arg: {q: shp.energy_si}
          to: HEP_natural
          constants: [c, hbar, E0]
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: explicit_hep_to_si_energy_boundary
        anchor: section 3, inverse naturalization
        ast:
          op: convert
          arg: {q: shp.energy_hep}
          to: SI
          constants: [c, hbar, E0]
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
    invariants:
      - id: mass_shell_representation_independence
        claimed_invariant: true
        group: invertible_si_hep_representation_changes
        anchor: section 5
      - id: lorentz_norm
        claimed_invariant: true
        group: proper_orthochronous_lorentz_group
        anchor: section 5
    claim_register:
      - id: unique_mechanical_naturalization_exponents
        status: theorem
        hypotheses:
          - quantity_dimension_lies_in_rational_LMT_sector
          - positive_branch_declared_for_fractional_powers
      - id: naturalization_round_trip
        status: proposition
        hypotheses:
          - fixed_positive_energy_anchor
          - exact_same_passport_used_in_both_directions
      - id: rigidity_coefficient_exactness
        status: proposition
        hypotheses:
          - q_equals_z_times_elementary_charge
          - declared_units_are_GeV_per_c_and_tesla_metre
          - si_defining_values_of_c_and_e
    protocol_fields_present:
      - hidden_space
      - system_descriptor
      - reduction
      - deterministic_observation
      - stochastic_channel_or_explicit_noiseless_model
      - observed_space
      - reference_frame
      - quantizer_or_partition
      - spatial_resolution
      - temporal_resolution
      - observation_horizon
      - estimator_or_declared_direct_readout
      - uncertainty_or_exactness_statement
      - unit_context
      - defect_normalizations
    manual_findings: []
    next_action: use_as_normative_unit_extension_for_remaining_physical_modules

