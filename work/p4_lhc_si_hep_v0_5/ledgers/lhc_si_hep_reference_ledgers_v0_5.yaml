    expressions:
      - id: hep_proton_mass_shell
        anchor: section 5, E^2=pi^2+mu_p^2
        ast:
          op: sub
          args:
            - op: pow
              arg: {q: lhc13.energy_hep}
              exponent: 2
            - op: pow
              arg: {q: lhc13.momentum_energy_hep}
              exponent: 2
        expect:
          outcome: pass
          rules: []
          dimension: [4, 2, -4, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: lorentz_factor
        anchor: section 5, gamma=E/mu_p
        ast:
          op: normalize
          value: {q: lhc13.energy_hep}
          reference: {q: lhc13.mass_energy_hep}
          zero_policy: positive_proton_mass_energy
        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: speed_ratio
        anchor: section 5, beta=pi/E
        ast:
          op: normalize
          value: {q: lhc13.momentum_energy_hep}
          reference: {q: lhc13.energy_hep}
          zero_policy: positive_total_energy
        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: stable_one_minus_beta
        anchor: section 5, (1/gamma^2)/(1+beta)
        ast:
          op: div
          left:
            op: div
            left: {const: 1}
            right:
              op: pow
              arg: {q: lhc13.gamma_rel}
              exponent: 2
          right:
            op: add
            args:
              - {const: 1}
              - {q: lhc13.beta_rel}
        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: minkowski_interval
        anchor: section 6, Delta_s^2=c^2*Delta_t^2-Delta_r^2
        ast:
          op: sub
          args:
            - op: pow
              arg:
                op: mul
                left: {q: lhc13.c}
                right: {q: lhc13.duration}
              exponent: 2
            - op: pow
              arg: {q: lhc13.displacement_magnitude}
              exponent: 2
        expect:
          outcome: pass
          rules: []
          dimension: [2, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: magnetic_rigidity
        anchor: section 7, p=q*B*rho
        ast:
          op: mul
          left: {q: lhc13.charge_si}
          right: {q: lhc13.rigidity_si}
        expect:
          outcome: pass
          rules: []
          dimension: [1, 1, -1, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: rf_energy_gain
        anchor: section 8, DeltaE=q*V_eff*sin(phi_s)
        ast:
          op: mul
          left:
            op: mul
            left: {q: lhc13.charge_si}
            right: {q: lhc13.voltage_si}
          right:
            op: trig
            function: sin
            arg: {q: lhc13.rf_phase}
        expect:
          outcome: pass
          rules: []
          dimension: [2, 1, -2, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: relative_momentum_offset
        anchor: section 8, delta=(p-p0)/p0
        ast:
          op: normalize
          value:
            op: sub
            args:
              - {q: lhc13.momentum_magnitude_si}
              - {q: lhc13.reference_momentum_si}
          reference: {q: lhc13.reference_momentum_si}
          zero_policy: positive_reference_momentum
        expect:
          outcome: pass
          rules: []
          dimension: [0, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: hill_second_derivative
        anchor: section 9, x_double_prime
        ast:
          op: derivative
          dependent:
            op: derivative
            dependent: {q: lhc13.x}
            independent: {q: lhc13.s}
          independent: {q: lhc13.s}
        expect:
          outcome: pass
          rules: []
          dimension: [-1, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: hill_focusing_term
        anchor: section 9, K(s)*x
        ast:
          op: mul
          left: {q: lhc13.K}
          right: {q: lhc13.x}
        expect:
          outcome: pass
          rules: []
          dimension: [-1, 0, 0, 0, 0, 0, 0]
          semantic_kind: scalar
      - id: twiss_ellipse_sum
        anchor: section 9, gamma_T*x^2+2*alpha_T*x*xprime+beta_T*xprime^2
        ast:
          op: add
          args:
            - op: mul
              left: {q: lhc13.twiss_gamma}
              right:
                op: pow
                arg: {q: lhc13.x}
                exponent: 2
            - op: mul
