        symbol: Y
        semantic_kind: scalar
        dimension: [0, 0, 1, 0, 0, 0, 0]
        canonical_unit: s
        unit_context: SI
        frame: observer
        claim_status: model
      - id: qc.two_pi
        symbol: two_pi
        semantic_kind: scalar
        dimension: [0, 0, 0, 0, 0, 0, 0]
