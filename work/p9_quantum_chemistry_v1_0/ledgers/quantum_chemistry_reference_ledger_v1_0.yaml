schema:
  id: go-quantum-chemistry-reference-ledger
  version: 1.0.0
  date: 2026-07-28
  base_contract: go-core-spec@0.2.0
  inherited_contracts:
    - go-conical-intersections-observation-contract@0.9.0
  extension_contract: go-quantum-chemistry-observation-contract@1.0.0

documents:
  - id: quantum-chemistry-observation-v1-1
    title: Quantum Chemistry as a Typed Inference Stack under Observation Maps
    version: 1.1.0
    source:
      pdf: work/p9_quantum_chemistry_v1_0/build/qchem/quantum_chemistry_observation_geometry_v1_1.pdf
      tex: work/p9_quantum_chemistry_v1_0/src/quantum_chemistry_observation_geometry_v1_1.tex
      text: work/p9_quantum_chemistry_v1_0/checks/qchem/quantum_chemistry_observation_geometry_v1_1.txt
      metrics_json: work/p9_quantum_chemistry_v1_0/data/quantum_chemistry_metrics_v1_0.json
      pages: 9
      sha256: f3b1056f215cebeca914b3c1d3589e18b3764f518a5daac580a487541a9dae8a
    ledger_level: reference
    migration_status: strict_reference_migrated
    unit_contexts:
      - SI
      - atomic
      - neutral
    groups:
      - electron_permutation_sign_representation
      - global_state_phase
      - occupied_orbital_U_N_gauge
      - Euclidean_nuclear_rigid_motions
      - identical_nucleus_permutations
      - basis_changes_with_overlap_metric
      - instrument_calibration_transformations
    maps:
      - id: exact_to_clamped_nuclei_model
        domain: full_electron_nuclear_Hamiltonian_and_state
        codomain: parametric_electronic_Hamiltonian_family
        kind: reduction
        invertibility: not_required
        information_loss: possible
      - id: born_huang_expansion
        domain: full_molecular_state_in_declared_electronic_family
        codomain: coupled_nuclear_channel_amplitudes
        kind: frame_transform
        invertibility: required
        information_loss: false
      - id: one_body_partial_trace
        domain: normalized_N_electron_density_operator
        codomain: trace_N_one_body_reduced_density_matrix
        kind: reduction
        invertibility: not_required
        information_loss: possible
      - id: density_diagonal
        domain: one_body_reduced_density_matrix
        codomain: spin_summed_spatial_density
        kind: deterministic_observation
        invertibility: not_required
        information_loss: possible
      - id: occupied_orbital_rotation
        domain: S_orthonormal_occupied_coefficient_frame
        codomain: equivalent_occupied_coefficient_frame
        kind: gauge_transform
        invertibility: required
        information_loss: false
      - id: active_space_reduction
        domain: one_body_reduced_density_matrix_and_declared_projector
        codomain: active_one_body_reduced_density_matrix
        kind: reduction
        invertibility: not_required
        information_loss: possible
      - id: nuclear_rigid_motion_quotient
        domain: labeled_nuclear_Cartesian_configuration
        codomain: internal_geometry_equivalence_class
        kind: reduction
        invertibility: not_required
        information_loss: possible
      - id: harmonic_normal_mode_reduction
        domain: stationary_geometry_Hessian_and_mass_matrix
        codomain: vibrational_eigenvalues_and_modes
        kind: deterministic_observation
        invertibility: not_required
        information_loss: possible
      - id: ideal_spectral_readout
        domain: state_energies_populations_transition_operator_and_line_profile
        codomain: ideal_transition_spectral_density
        kind: deterministic_observation
        invertibility: not_required
        information_loss: possible
      - id: instrument_channel
        domain: ideal_transition_spectral_density
        codomain: probability_law_on_sampled_instrument_records
        kind: stochastic_channel
        invertibility: not_applicable
        information_loss: possible
      - id: spectral_estimator
        domain: sampled_instrument_records_and_calibration
        codomain: fitted_lines_assignments_and_uncertainties
        kind: estimator
        invertibility: not_applicable
        information_loss: not_a_map_property
      - id: bond_population_interpretation
        domain: state_basis_active_space_and_named_scheme
        codomain: scheme_conditional_chemical_descriptors
        kind: interpretation
        invertibility: not_required
        information_loss: not_applicable
    symbols:
      - scope: many_body_state
        key: Gamma_N
        meaning: normalized_N_electron_density_operator
      - scope: reduced_density
        key: gamma_1
        meaning: trace_N_one_body_reduced_density_matrix
      - scope: spatial_density
        key: n
        meaning: spin_summed_particle_number_density
      - scope: clamped_nuclei
        key: H_e
        meaning: electronic_Hamiltonian_family_including_declared_nuclear_repulsion
      - scope: finite_basis
        key: S
        meaning: positive_definite_overlap_matrix
      - scope: finite_basis
        key: C_occ
        meaning: occupied_orbital_coefficient_frame
      - scope: orbital_gauge
        key: U_occ
        meaning: occupied_subspace_unitary_rotation
      - scope: nuclear_geometry
        key: K
        meaning: mass_weighted_Hessian
      - scope: normal_mode
        key: lambda_k
        meaning: squared_angular_frequency_eigenvalue
      - scope: spectroscopy
        key: S_A
        meaning: ideal_transition_spectral_density
      - scope: observation
        key: Y
        meaning: sampled_noisy_instrument_record
    quantities:
      - id: qc.full_energy
        extends: mechanics.energy
        symbol: E_mol
        frame: scalar
      - id: qc.electronic_kinetic
        extends: mechanics.energy
        symbol: T_e
        frame: scalar
      - id: qc.nuclear_kinetic
        extends: mechanics.energy
        symbol: T_n
        frame: scalar
      - id: qc.electron_nuclear_energy
