        unit_context: neutral
        frame: none
        claim_status: definition
    expressions:
      - id: full_molecular_Hamiltonian_energy
        anchor: equation (1), five energy terms
        ast:
          op: add
          args:
            - {q: qc.electronic_kinetic}
            - {q: qc.nuclear_kinetic}
            - {q: qc.electron_nuclear_energy}
            - {q: qc.electron_electron_energy}
            - {q: qc.nuclear_repulsion}
        expect: {outcome: pass, rules: [], dimension: [2, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: clamped_Hamiltonian_energy
        anchor: equation (3), clamped electronic energy terms
        ast:
          op: add
          args:
            - {q: qc.electronic_kinetic}
            - {q: qc.electron_nuclear_energy}
            - {q: qc.electron_electron_energy}
            - {q: qc.nuclear_repulsion}
        expect: {outcome: pass, rules: [], dimension: [2, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: transition_energy_difference
        anchor: equation (18), E_f minus E_i
        ast: {op: sub, args: [{q: qc.final_energy}, {q: qc.initial_energy}]}
        expect: {outcome: pass, rules: [], dimension: [2, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: angular_frequency_from_energy_gap
        anchor: equation (18), omega_fi equals Delta E over hbar
        ast: {op: div, left: {q: qc.energy_gap}, right: {q: qc.hbar}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, -1, 0, 0, 0, 0], semantic_kind: scalar}
      - id: cyclic_frequency_from_energy_gap
        anchor: spectroscopy contract, nu_fi equals Delta E over h
        ast: {op: div, left: {q: qc.energy_gap}, right: {q: qc.Planck_constant}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, -1, 0, 0, 0, 0], semantic_kind: scalar}
      - id: energy_from_angular_frequency
        anchor: equation (18), Delta E equals hbar omega
        ast: {op: mul, left: {q: qc.hbar}, right: {q: qc.angular_frequency}}
        expect: {outcome: pass, rules: [], dimension: [2, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: energy_from_cyclic_frequency
        anchor: spectroscopy contract, Delta E equals h nu
        ast: {op: mul, left: {q: qc.Planck_constant}, right: {q: qc.cyclic_frequency}}
        expect: {outcome: pass, rules: [], dimension: [2, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: angular_frequency_squared
        anchor: equation (16), omega squared
        ast: {op: pow, arg: {q: qc.angular_frequency}, exponent: 2}
        expect: {outcome: pass, rules: [], dimension: [0, 0, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: angular_frequency_from_mass_weighted_eigenvalue
        anchor: equation (16), omega equals square root lambda
        ast: {op: sqrt, arg: {q: qc.mass_weighted_eigenvalue}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, -1, 0, 0, 0, 0], semantic_kind: scalar}
      - id: cyclic_frequency_from_angular_frequency
        anchor: equation (16), nu equals omega over two pi
        ast: {op: div, left: {q: qc.angular_frequency}, right: {q: qc.two_pi}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, -1, 0, 0, 0, 0], semantic_kind: scalar}
      - id: spectroscopic_wavenumber
        anchor: equation (16), nu tilde equals nu over c
        ast: {op: div, left: {q: qc.cyclic_frequency}, right: {q: qc.speed_of_light}}
        expect: {outcome: pass, rules: [], dimension: [-1, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: first_energy_derivative
        anchor: nuclear force dimension from PES gradient
        ast: {op: derivative, dependent: {q: qc.clamped_energy}, independent: {q: qc.nuclear_coordinate}}
        expect: {outcome: pass, rules: [], dimension: [1, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: second_energy_derivative
        anchor: equation (15), Cartesian Hessian dimension
        ast:
          op: derivative
          dependent:
            op: derivative
            dependent: {q: qc.clamped_energy}
            independent: {q: qc.nuclear_coordinate}
          independent: {q: qc.nuclear_coordinate}
        expect: {outcome: pass, rules: [], dimension: [0, 1, -2, 0, 0, 0, 0], semantic_kind: scalar}
      - id: inverse_sqrt_mass
        anchor: equation (15), M to power minus one half
        ast: {op: pow, arg: {q: qc.nuclear_mass}, exponent: "-1/2"}
        expect: {outcome: pass, rules: [], dimension: [0, "-1/2", 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: inverse_mass_from_two_factors
        anchor: equation (15), two inverse square-root mass factors
        ast: {op: pow, arg: {q: qc.inverse_sqrt_mass}, exponent: 2}
        expect: {outcome: pass, rules: [], dimension: [0, -1, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: mass_weighted_Hessian_dimension
        anchor: equation (15), M inverse times Hessian scale
        ast:
          op: mul
          left: {q: qc.inverse_mass}
          right: {q: qc.Cartesian_Hessian}
          semantic_kind: tensor
          frame: mode_basis
        expect: {outcome: pass, rules: [], dimension: [0, 0, -2, 0, 0, 0, 0], semantic_kind: tensor, frame: mode_basis}
      - id: Hessian_action_is_force
        anchor: harmonic linear force H_R delta R
        ast:
          op: mul
          left: {q: qc.Cartesian_Hessian}
          right: {q: qc.nuclear_displacement}
          semantic_kind: vector
          frame: nuclear_chart
        expect: {outcome: pass, rules: [], dimension: [1, 1, -2, 0, 0, 0, 0], semantic_kind: vector, frame: nuclear_chart}
      - id: mass_times_acceleration_is_force
        anchor: theorem 7.1 proof
        ast:
          op: mul
          left: {q: qc.nuclear_mass}
          right: {q: qc.acceleration}
          semantic_kind: vector
          frame: nuclear_chart
        expect: {outcome: pass, rules: [], dimension: [1, 1, -2, 0, 0, 0, 0], semantic_kind: vector, frame: nuclear_chart}
      - id: normal_mode_acceleration_scale
        anchor: theorem 7.1, lambda times displacement
        ast:
          op: mul
          left: {q: qc.mass_weighted_eigenvalue}
          right: {q: qc.nuclear_displacement}
          semantic_kind: vector
          frame: nuclear_chart
        expect: {outcome: pass, rules: [], dimension: [1, 0, -2, 0, 0, 0, 0], semantic_kind: vector, frame: nuclear_chart}
      - id: density_integral
        anchor: equation (8), integral n d3r
        ast: {op: integrate, integrand: {q: qc.number_density}, measure: {q: qc.volume_measure}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: scalar}
      - id: density_normalization_comparison
        anchor: equation (8), integral n equals N
        ast: {op: compare, left: {q: qc.integrated_density}, right: {q: qc.particle_number}}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: probability}
      - id: one_RDM_trace
        anchor: equation (8), trace gamma equals N
        ast: {q: qc.gamma_trace}
        expect: {outcome: pass, rules: [], dimension: [0, 0, 0, 0, 0, 0, 0], semantic_kind: count}
      - id: F_times_C
        anchor: equation (10), generalized eigenproblem left side
        ast:
          op: mul
          left: {q: qc.Fock_matrix}
          right: {q: qc.orbital_coefficients}
          semantic_kind: tensor
          frame: one_particle_basis
